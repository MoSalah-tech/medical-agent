services:
  backend:
    build:
      context: .               # root (where Dockerfile is)
    container_name: medical-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env                   # load variables from this file in the same directory
    restart: unless-stopped

  frontend:
    build:
      context: ./medical-agent-frontend
    container_name: medical-agent-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped